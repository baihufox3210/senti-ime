[workspace]
resolver = "3"
members = [
    "crates/senti-core",
    "crates/senti-context",
    "crates/senti-predictors",
    "crates/senti-plugins",
    "crates/senti-storage",
    "crates/senti-engine",
    "crates/senti-app",
    "crates/senti-gui",
    "crates/senti-platform",
]
default-members = [
    "crates/senti-core",
    "crates/senti-context",
    "crates/senti-predictors",
    "crates/senti-plugins",
    "crates/senti-storage",
    "crates/senti-engine",
    "crates/senti-app",
    "crates/senti-gui",
    "crates/senti-platform",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["SentiIME contributors"]

[workspace.dependencies]
senti-core = { path = "crates/senti-core" }
senti-context = { path = "crates/senti-context" }
senti-predictors = { path = "crates/senti-predictors" }
senti-plugins = { path = "crates/senti-plugins" }
senti-storage = { path = "crates/senti-storage" }
senti-engine = { path = "crates/senti-engine" }
senti-app = { path = "crates/senti-app" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 2

# Neural matrix arithmetic must stay responsive in debug IME/front-end runs.
[profile.dev.package."senti-predictors"]
opt-level = 2
